<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">
<style>
  @keyframes fadeSlide {
    0%   { opacity:0; transform:translateY(6px); }
    100% { opacity:1; transform:translateY(0); }
  }
  .mono { font-family:'Courier New',Courier,monospace; }
  .fade { opacity:0; animation:fadeSlide 0.4s forwards; }
  .val  { font-weight:bold; }
  .lbl  { letter-spacing:1px; text-transform:uppercase; }
</style>

<!-- Background -->
<rect width="480" height="220" rx="10" ry="10" fill="#0d1117"/>
<!-- Title bar -->
<rect width="480" height="28" rx="10" ry="10" fill="#161b22"/>
<rect y="18" width="480" height="10" fill="#161b22"/>
<circle cx="18" cy="14" r="5" fill="#ff5f56"/>
<circle cx="34" cy="14" r="5" fill="#ffbd2e"/>
<circle cx="50" cy="14" r="5" fill="#27c93f"/>
<text x="240" y="19" class="mono" font-size="11" fill="#484f58" text-anchor="middle">git log --stat — OxHazem</text>

<!-- Prompt -->
<text x="16" y="56" class="mono fade" font-size="12" style="animation-delay:0.0s;">
  <tspan fill="#f78166">OxHazem</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#7ee787">github</tspan><tspan fill="#c9d1d9"> ~ $ cat github-stats.json</tspan>
</text>

<!-- Separator -->
<line x1="16" y1="66" x2="464" y2="66" stroke="#30363d" stroke-width="1"/>

<!-- Stat blocks — row 1 -->

  <!-- Total Stars -->
  <text x="20" y="100" class="mono fade" font-size="22" fill="#7ee787" style="animation-delay:0.15s;">⭐</text>
  <text x="48" y="100"   class="mono fade val" font-size="18" fill="#c9d1d9" style="animation-delay:0.2s;">0</text>
  <text x="48" y="116" class="mono fade lbl" font-size="11" fill="#484f58" style="animation-delay:0.22999999999999998s;">Total Stars</text>

  <!-- Public Repos -->
  <text x="135" y="100" class="mono fade" font-size="22" fill="#7ee787" style="animation-delay:0.25s;">📁</text>
  <text x="163" y="100"   class="mono fade val" font-size="18" fill="#c9d1d9" style="animation-delay:0.3s;">34</text>
  <text x="163" y="116" class="mono fade lbl" font-size="11" fill="#484f58" style="animation-delay:0.33s;">Public Repos</text>

  <!-- Followers -->
  <text x="250" y="100" class="mono fade" font-size="22" fill="#7ee787" style="animation-delay:0.35s;">👥</text>
  <text x="278" y="100"   class="mono fade val" font-size="18" fill="#c9d1d9" style="animation-delay:0.39999999999999997s;">84</text>
  <text x="278" y="116" class="mono fade lbl" font-size="11" fill="#484f58" style="animation-delay:0.43s;">Followers</text>

  <!-- Forks -->
  <text x="365" y="100" class="mono fade" font-size="22" fill="#7ee787" style="animation-delay:0.45s;">🍴</text>
  <text x="393" y="100"   class="mono fade val" font-size="18" fill="#c9d1d9" style="animation-delay:0.5s;">0</text>
  <text x="393" y="116" class="mono fade lbl" font-size="11" fill="#484f58" style="animation-delay:0.53s;">Forks</text>

<!-- Separator -->
<line x1="16" y1="138" x2="464" y2="138" stroke="#30363d" stroke-width="1"/>

<!-- Footer timestamp -->
<text x="16" y="155" class="mono fade" font-size="11" fill="#484f58" style="animation-delay:0.55s;">Last refreshed: 2026-07-29 19:11 UTC</text>

<!-- Status bar -->
<rect x="16" y="170" width="448" height="28" rx="5" fill="#161b22"/>
<text x="24" y="188" class="mono fade" font-size="12" fill="#7ee787" style="animation-delay:0.6s;">● Live</text>
<text x="70" y="188" class="mono fade" font-size="12" fill="#8b949e" style="animation-delay:0.65s;">Auto-updated daily via GitHub Actions</text>
</svg>