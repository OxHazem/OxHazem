<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210">
<defs>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  @keyframes fadeSlide {
    0%   { opacity:0; transform:translateY(8px); }
    100% { opacity:1; transform:translateY(0); }
  }
  @keyframes pulse {
    0%,100% { opacity:.6; } 50% { opacity:1; }
  }
  .mono { font-family:'Courier New',Courier,monospace; }
  .fade { opacity:0; animation:fadeSlide .4s forwards; }
  .val  { font-weight:bold; letter-spacing:-0.5px; }
  .lbl  { letter-spacing:1.5px; text-transform:uppercase; }
</style>

<!-- Background -->
<rect width="520" height="210" rx="10" fill="#0d1117"/>

<!-- Title bar -->
<rect width="520" height="30" rx="10" fill="#161b22"/>
<rect y="20" width="520" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f56"/>
<circle cx="36" cy="15" r="5.5" fill="#ffbd2e"/>
<circle cx="54" cy="15" r="5.5" fill="#27c93f"/>
<text x="260" y="20" class="mono" font-size="11" fill="#484f58" text-anchor="middle">
  github-stats — OxHazem
</text>

<!-- Prompt line -->
<text x="16" y="54" class="mono fade" font-size="12" style="animation-delay:.0s;">
  <tspan fill="#f78166">OxHazem</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#7ee787">github</tspan>
  <tspan fill="#8b949e"> ~ $ </tspan><tspan fill="#c9d1d9">cat stats.json</tspan>
</text>

<!-- 4 stat cells -->

  <rect x="16" y="64" width="113" height="100" rx="6" fill="#161b22"/>
  <rect x="16" y="64" width="3" height="100" rx="2" fill="#58a6ff"/>
  <text x="32" y="92" font-family="'Segoe UI Emoji',monospace" font-size="18" opacity="0"
        style="animation:fadeSlide .4s 0.15s forwards;">⭐</text>
  <text x="32" y="122" class="mono val fade" font-size="26" fill="#e6edf3"
        style="animation-delay:0.20s;">0</text>
  <text x="32" y="140" class="mono lbl fade" font-size="10" fill="#484f58"
        style="animation-delay:0.24s;">Total  Stars</text>

  <rect x="141" y="64" width="113" height="100" rx="6" fill="#161b22"/>
  <rect x="141" y="64" width="3" height="100" rx="2" fill="#7ee787"/>
  <text x="157" y="92" font-family="'Segoe UI Emoji',monospace" font-size="18" opacity="0"
        style="animation:fadeSlide .4s 0.25s forwards;">📁</text>
  <text x="157" y="122" class="mono val fade" font-size="26" fill="#e6edf3"
        style="animation-delay:0.30s;">34</text>
  <text x="157" y="140" class="mono lbl fade" font-size="10" fill="#484f58"
        style="animation-delay:0.34s;">Public  Repos</text>

  <rect x="266" y="64" width="113" height="100" rx="6" fill="#161b22"/>
  <rect x="266" y="64" width="3" height="100" rx="2" fill="#f78166"/>
  <text x="282" y="92" font-family="'Segoe UI Emoji',monospace" font-size="18" opacity="0"
        style="animation:fadeSlide .4s 0.35s forwards;">👥</text>
  <text x="282" y="122" class="mono val fade" font-size="26" fill="#e6edf3"
        style="animation-delay:0.40s;">84</text>
  <text x="282" y="140" class="mono lbl fade" font-size="10" fill="#484f58"
        style="animation-delay:0.44s;">Followers</text>

  <rect x="391" y="64" width="113" height="100" rx="6" fill="#161b22"/>
  <rect x="391" y="64" width="3" height="100" rx="2" fill="#d2a8ff"/>
  <text x="407" y="92" font-family="'Segoe UI Emoji',monospace" font-size="18" opacity="0"
        style="animation:fadeSlide .4s 0.45s forwards;">🍴</text>
  <text x="407" y="122" class="mono val fade" font-size="26" fill="#e6edf3"
        style="animation-delay:0.50s;">0</text>
  <text x="407" y="140" class="mono lbl fade" font-size="10" fill="#484f58"
        style="animation-delay:0.54s;">Total  Forks</text>

<!-- Bottom bar -->
<rect x="16" y="175" width="488" height="22" rx="5" fill="#161b22"/>
<circle cx="28" cy="186" r="4" fill="#27c93f" style="animation:pulse 2s infinite;"/>
<text x="40" y="190" class="mono" font-size="11" fill="#7ee787">Live</text>
<text x="74" y="190" class="mono" font-size="11" fill="#484f58">
  Auto-refreshed daily via GitHub Actions · 2026-07-29
</text>
</svg>