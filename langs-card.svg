<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 342">
<style>
  @keyframes fadeSlide {
    0%   { opacity:0; transform:translateY(5px); }
    100% { opacity:1; transform:translateY(0); }
  }
  .mono  { font-family:'Courier New',Courier,monospace; }
  .fade  { opacity:0; animation:fadeSlide .4s forwards; }
  .lname { font-weight:500; }
  .pct   { font-weight:bold; }
</style>

<!-- Background -->
<rect width="420" height="342" rx="10" fill="#0d1117"/>

<!-- Title bar -->
<rect width="420" height="30" rx="10" fill="#161b22"/>
<rect y="20" width="420" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f56"/>
<circle cx="36" cy="15" r="5.5" fill="#ffbd2e"/>
<circle cx="54" cy="15" r="5.5" fill="#27c93f"/>
<text x="210" y="20" class="mono" font-size="11" fill="#484f58" text-anchor="middle">
  top-langs — OxHazem
</text>

<!-- Prompt -->
<text x="16" y="54" class="mono fade" font-size="12" style="animation-delay:.0s;">
  <tspan fill="#f78166">OxHazem</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#7ee787">github</tspan>
  <tspan fill="#8b949e"> ~ $ </tspan><tspan fill="#c9d1d9">cloc --sort=code ~/projects/</tspan>
</text>

<!-- Section heading -->
